# The quality gate.
#
# This is `task all`, run on a machine nobody owns. It is not a second gate
# with its own opinions: every job here corresponds to a task, and
# `scripts/check-tool-versions.sh` refuses a workflow that installs a version
# the dev image is not built with (ADR 0009).
#
# Jobs run in the same base image the dev container is built from, pinned by
# the same digest.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    # `edited` so a rewritten PR title is re-checked by commitlint.
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GOFLAGS: -buildvcs=false

jobs:
  # task lint:pins, task lint:tools
  pins:
    name: Pins (digests · action SHAs · tool versions)
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install skopeo
        # Without it check-pins.sh reports "skip (skopeo unavailable)" for
        # every image and still exits 0 — a green check that verified nothing.
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends skopeo
      - name: Digests and action SHAs resolve
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/check-pins.sh
      - name: CI and the dev image agree on tool versions
        run: scripts/check-tool-versions.sh

  # task build, task test, task test:contract
  build-test:
    name: Build & test
    runs-on: ubuntu-latest
    container:
      image: docker.io/library/golang:1.26-trixie@sha256:4ee9ffa999b4583ce281939cdff828763083610292f252279a0cee77473bd9a7 # pin: GO_IMAGE
    steps:
      - uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Cache Go modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}

      - name: Build
        run: |
          go build -ldflags="-s -w -X main.version=ci-${GITHUB_SHA::8}" \
            -o bin/terraform-provider-powerdns .

      - name: Install gotestsum
        run: go install gotest.tools/gotestsum@v1.13.0 # pin: GOTESTSUM_VERSION

      # The unit and contract suites are one `go test ./...`: the contract
      # tests carry no build tag, because a test that only runs when somebody
      # remembers a tag is a test that stops running.
      - name: Test
        run: |
          gotestsum --junitfile unit-report.xml --format short-verbose \
            -- ./... -race -count=1 -coverprofile=coverage.out -covermode=atomic
      - name: Coverage summary
        run: go tool cover -func=coverage.out | tail -1

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-reports
          path: |
            unit-report.xml
            coverage.out
          retention-days: 30

  # task lint
  lint-go:
    name: Lint (Go · golangci-lint v2)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.12.2 # pin: GOLANGCI_LINT_VERSION
          # SARIF as well as the human output. gosec is one of the linters
          # .golangci.yml enables, so its findings reach the Security tab from
          # the configuration the repository already has — rather than from a
          # second gosec run with a second set of exclusions to keep in step.
          args: --timeout=10m --output.text.path stdout --output.sarif.path golangci.sarif
      - uses: github/codeql-action/upload-sarif@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4.37.3
        if: always()
        with:
          sarif_file: golangci.sarif
          category: golangci-lint

  # task vulncheck
  vulncheck:
    name: Vulnerability audit (govulncheck)
    runs-on: ubuntu-latest
    container:
      image: docker.io/library/golang:1.26-trixie@sha256:4ee9ffa999b4583ce281939cdff828763083610292f252279a0cee77473bd9a7 # pin: GO_IMAGE
    steps:
      - uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Cache Go modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
      - run: go install golang.org/x/vuln/cmd/govulncheck@v1.6.0 # pin: GOVULNCHECK_VERSION
      - run: govulncheck ./...

  # task py
  lint-py:
    name: Lint (Python · ruff · ty)
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.33" # pin: UV_VERSION
      - name: ruff
        run: |
          uv tool run ruff@0.16.0 check scripts/       # pin: RUFF_VERSION
          uv tool run ruff@0.16.0 format --check scripts/
      # ty is pre-1.0. A ty-only failure is reviewed, not obeyed — the same
      # standing the Taskfile gives it, for the same reason.
      - name: ty
        continue-on-error: true
        run: uv tool run ty@0.0.64 check scripts/ # pin: TY_VERSION

  # task tf:fmt:check, task docs:check
  terraform:
    name: Terraform (fmt · registry docs)
    runs-on: ubuntu-latest
    container:
      image: docker.io/library/golang:1.26-trixie@sha256:4ee9ffa999b4583ce281939cdff828763083610292f252279a0cee77473bd9a7 # pin: GO_IMAGE
    steps:
      - uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Terraform
        run: |
          curl -fsSL -o /tmp/tf.zip \
            "https://releases.hashicorp.com/terraform/1.15.8/terraform_1.15.8_linux_amd64.zip" # pin: TERRAFORM_VERSION
          unzip -o -d /usr/local/bin /tmp/tf.zip
      - run: terraform fmt -check -recursive examples
      - run: go install github.com/hashicorp/terraform-plugin-docs/cmd/tfplugindocs@v0.25.0 # pin: TFPLUGINDOCS_VERSION
      # Validates what the Registry will read. It also answers the question
      # S7 left open — whether the internal documents under docs/ are treated
      # as provider pages — every time it runs.
      - run: tfplugindocs validate --provider-name powerdns

  # task docs:lint
  lint-docs:
    name: Lint (docs · markdown · yaml · spell · badges)
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22' # pin: NODE_MAJOR
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.33" # pin: UV_VERSION
      - run: npm install -g markdownlint-cli2@latest cspell@latest
      - run: markdownlint-cli2 "**/*.md" "#node_modules" "#bin" "#dist"
      - run: uv tool run yamllint -c .yamllint.yaml .
      - run: cspell --no-progress --no-summary --config .cspell.json "**/*.md" "**/*.go"
      # Every shieldcn badge resolves and every mermaid block parses. A broken
      # badge is invisible in review and visible on the front page.
      - run: scripts/check-badges.sh

  # The half the commit-msg hook cannot reach: a hook only protects a clone
  # that ran `task hooks`. This protects the branch, and its ancestor caught
  # nine of the first ten commits in this repository.
  commits:
    name: Commits (conventional · no AI attribution)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22' # pin: NODE_MAJOR
      - run: npm install -g @commitlint/cli@latest @commitlint/config-conventional@latest
      - name: Conventional Commits over the pull request
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: commitlint --config .commitlintrc.yaml --from "$BASE_SHA" --to "$HEAD_SHA" --verbose
      - name: Conventional Commits over the title
        # The title becomes the commit message on a squash merge, so it is the
        # message that survives — and it is edited after the commits are made.
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s\n' "$PR_TITLE" | commitlint --config .commitlintrc.yaml
      - name: No AI attribution (AGENTS.md golden rule 6)
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -euo pipefail
          status=0
          while read -r sha; do
            [ -n "$sha" ] || continue
            git log -1 --format='%B' "$sha" > /tmp/msg.txt
            scripts/check-no-ai-attribution.sh /tmp/msg.txt || { echo "  in commit $sha" >&2; status=1; }
          done < <(git rev-list "${BASE_SHA}..${HEAD_SHA}")
          # And the squash message, which is the title and body rather than
          # any commit that was checked above.
          printf '%s\n\n%s\n' "$PR_TITLE" "$PR_BODY" > /tmp/squash.txt
          scripts/check-no-ai-attribution.sh /tmp/squash.txt || { echo "  in the pull request title or body" >&2; status=1; }
          exit "$status"
