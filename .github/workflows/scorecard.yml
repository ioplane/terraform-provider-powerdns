# OpenSSF Scorecard.
#
# The provider is going to the Terraform Registry, where anyone can take a
# dependency on it without knowing anything about how it is built. Scorecard
# is the public answer to that: pinned actions, branch protection, no
# long-lived tokens, a signed release. It scores what this repository already
# claims, from outside, on a schedule.
name: Scorecard

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 6 * * 1'

# Named rather than `read-all`, which the upstream template uses. Scorecard
# reads the workflow definitions and the branch configuration; nothing else.
permissions:
  contents: read

jobs:
  analysis:
    name: OpenSSF Scorecard
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      contents: read
      actions: read
      security-events: write
      # Scorecard publishes its result to the public OpenSSF dataset, which it
      # authenticates with an OIDC token rather than a stored secret.
      id-token: write
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: scorecard.sarif
          results_format: sarif
          publish_results: true
      - uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: scorecard.sarif
          category: scorecard
