# compose.e2e.yml — the end-to-end fixture, Compose Specification.
#
# What compose.lab.yml is to the provider, this is to a consumer of it: the
# pieces a real configuration sits on that the acceptance suite deliberately
# does without — remote state, a module source, and an engine driving both.
#
# It does not replace the lab, it extends it. PowerDNS and PostgreSQL come from
# compose.lab.yml and must already be running; this adds only what is missing.
#
# Every image is pinned by digest. A tag is a mutable reference.

name: terraform-provider-powerdns-e2e

services:
  # Remote state over S3.
  #
  # SeaweedFS rather than MinIO, and not on features — either serves the S3
  # API the backend needs. MinIO is AGPL-3.0 and its newest source release had
  # no published image, so "latest release" and "latest image" were already
  # different things for it. SeaweedFS is Apache-2.0, which is this
  # repository's own licence, and publishes an image per release.
  #
  # `weed server -s3` runs master, volume, filer and the S3 gateway in one
  # process. That is more moving parts than an object store needs to be, and
  # fewer containers than running them apart — the fixture wants one endpoint,
  # not an architecture.
  s3:
    container_name: pdns-e2e-s3
    image: docker.io/chrislusf/seaweedfs:4.40@sha256:52194fba4fecd0083c842158b3a902ba6e04a63619b2b0efcd08007bdb6a4602
    command:
      - server
      - -dir=/data
      - -s3
      - -s3.port=19000
      - -master.port=19333
      - -volume.port=19080
      - -filer.port=18888
      - -ip=127.0.0.1
    environment:
      # The gateway reads these and admits one identity with them. A
      # configuration file would allow more, and one identity is what a
      # fixture needs.
      AWS_ACCESS_KEY_ID: e2eaccesskey
      AWS_SECRET_ACCESS_KEY: e2esecretkey
    network_mode: host
    volumes:
      - s3-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:19000/ >/dev/null 2>&1 || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  # A git remote for the module source.
  #
  # Forgejo rather than `git daemon`, which is what this was first. The
  # protocol is the reason: `git://` is anonymous and unencrypted, and nobody
  # sources a production module that way. Real configurations use HTTPS with a
  # token or SSH with a key, and the failure people actually hit is
  # authentication — which an anonymous remote cannot exercise at all.
  #
  # The rootless variant, so this drops privilege by construction rather than
  # because a scanner asked.
  forgejo:
    container_name: pdns-e2e-forgejo
    image: codeberg.org/forgejo/forgejo:16.0.1-rootless@sha256:71863f6b6c5837a27b3a2d133c3161c78a432aa878d57798d74b1d917ff842be
    environment:
      # Installed by configuration, not by a wizard nobody is there to click.
      FORGEJO__security__INSTALL_LOCK: "true"
      FORGEJO__database__DB_TYPE: sqlite3
      FORGEJO__server__HTTP_PORT: "19300"
      # TLS, on a fixture. Not ceremony: a module source is fetched over HTTPS
      # everywhere it matters, and a fixture that authenticates over plain HTTP
      # is a fixture people copy the wrong shape from. The certificate is
      # self-signed and generated by `task e2e:up`; the dev container is told
      # to trust that one certificate and nothing else.
      FORGEJO__server__PROTOCOL: https
      FORGEJO__server__CERT_FILE: /etc/forgejo-tls/cert.pem
      FORGEJO__server__KEY_FILE: /etc/forgejo-tls/key.pem
      FORGEJO__server__ROOT_URL: https://127.0.0.1:19300/
      FORGEJO__server__DOMAIN: 127.0.0.1
      FORGEJO__server__DISABLE_SSH: "true"
      # A fixture, not a forge: nobody signs up, and the tests create what they
      # need through the API.
      FORGEJO__service__DISABLE_REGISTRATION: "true"
      FORGEJO__log__LEVEL: warn
    network_mode: host
    volumes:
      - forgejo-data:/var/lib/gitea:z
      - ../../test/e2e/.tls:/etc/forgejo-tls:ro,z
    healthcheck:
      test: ["CMD-SHELL", "curl -sfk https://127.0.0.1:19300/api/healthz || exit 1"]
      interval: 3s
      timeout: 5s
      retries: 40
    restart: unless-stopped

volumes:
  forgejo-data:
  s3-data:
