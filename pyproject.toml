# Python tooling for the repository's automation scripts.
#
# There is no Python package here to publish — the scripts under scripts/ drive
# the lab and the dev container. This file exists so ruff and ty have a single
# declared configuration rather than per-invocation flags.
#
# Managed with uv: https://docs.astral.sh/uv/
#   uv sync           install the pinned tool environment
#   uv run ruff check scripts/
#   uv run ty check scripts/

[project]
name = "terraform-provider-powerdns-automation"
version = "0.1.0"
description = "Lab and build automation for terraform-provider-powerdns."
requires-python = ">=3.12"
dependencies = [
    "podman==5.8.0", # pin: PODMAN_PY_VERSION
]

[dependency-groups]
dev = [
    "ruff==0.16.0", # pin: RUFF_VERSION
    "ty==0.0.64", # pin: TY_VERSION
    # The checks under scripts/checks/ are tested. They were shell scripts
    # whose only test was running them, which is why several shipped with a
    # branch that had never executed.
    "pytest==9.1.1",
]
# The end-to-end suite. Kept out of `dev` because it is the only thing that
# needs a database driver and an S3 client, and neither belongs in the group
# every linter run installs.
e2e = [
    "pytest==9.1.1",
    "podman==5.8.0", # pin: PODMAN_PY_VERSION
    "pytest-timeout==2.4.0",
    "boto3==1.43.58",
    "dnspython==2.8.0",
    "psycopg[binary]==3.3.4",
    "tenacity==9.1.4",
]

# --- pytest ----------------------------------------------------------------
# https://docs.pytest.org/
[tool.pytest.ini_options]
# Named, not discovered: `pytest` with no argument would otherwise collect the
# end-to-end suite, which needs five containers and an S3 endpoint.
testpaths = ["test/scripts"]
# The checks are imported, not shelled out to. `python -m` finds them because
# it puts the working directory first; pytest needs telling.
pythonpath = ["."]
addopts = "-ra --strict-markers --strict-config"
xfail_strict = true

[tool.uv]
# The scripts are not an installable package; uv should manage the environment
# without trying to build one.
package = false

# No exclude-newer, deliberately.
#
# semgrep's uv-missing-dependency-cooldown rule wants a cooldown so a release
# published minutes ago cannot be resolved. The reasoning is sound and the
# setting is incompatible with this project: every tool here is pinned to its
# current release, and a seven-day cooldown makes those pins unsatisfiable —
# `ruff==0.16.0` was published inside the window, and resolution fails outright
# rather than falling back.
#
# What replaces it: exact version pins rather than ranges, `uv.lock` with
# hashes committed, and a container image whose base is pinned by digest. Those
# make the resolution reproducible. They do not protect against a release that
# was compromised before it was pinned here, which is the gap the rule names
# and this project accepts.
#
# Revisit if the pins ever loosen to ranges, where a cooldown would cost
# nothing.

# --- ruff -------------------------------------------------------------------
# https://docs.astral.sh/ruff/
[tool.ruff]
target-version = "py312"
line-length = 88
src = ["scripts"]

[tool.ruff.lint]
# Same philosophy as .golangci.yml: an explicit allowlist gives an auditable
# surface, and the strict rules are on by default rather than opted into.
select = [
    "F",      # pyflakes
    "E", "W", # pycodestyle
    "I",      # isort
    "N",      # pep8-naming
    "D",      # pydocstyle
    "UP",     # pyupgrade
    "ANN",    # flake8-annotations
    "S",      # flake8-bandit
    "BLE",    # flake8-blind-except
    "B",      # flake8-bugbear
    "A",      # flake8-builtins
    "C4",     # flake8-comprehensions
    "DTZ",    # flake8-datetimez
    "T10",    # flake8-debugger
    "EM",     # flake8-errmsg
    "EXE",    # flake8-executable
    "ISC",    # flake8-implicit-str-concat
    "ICN",    # flake8-import-conventions
    "LOG",    # flake8-logging
    "G",      # flake8-logging-format
    "INP",    # flake8-no-pep420
    "PIE",    # flake8-pie
    "T20",    # flake8-print
    "PT",     # flake8-pytest-style
    "Q",      # flake8-quotes
    "RSE",    # flake8-raise
    "RET",    # flake8-return
    "SLF",    # flake8-self
    "SIM",    # flake8-simplify
    "TID",    # flake8-tidy-imports
    "TC",     # flake8-type-checking
    "ARG",    # flake8-unused-arguments
    "PTH",    # flake8-use-pathlib
    "TD",     # flake8-todos
    "ERA",    # eradicate
    "PL",     # pylint
    "TRY",    # tryceratops
    "FLY",    # flynt
    "PERF",   # perflint
    "FURB",   # refurb
    "RUF",    # ruff-specific
]

ignore = [
    # The scripts are operator-facing command-line tools: printing to stdout is
    # their output mechanism, not a debugging leftover.
    "T201",
    # One-line docstring on the module is enough; the tools are short.
    "D203", "D213",
    # Conflicts with the formatter.
    "ISC001",
]

[tool.ruff.lint.per-file-ignores]
# subprocess use is the point of the automation, and every call site is a fixed
# argument list with no shell and no user input.
"scripts/automation/*.py" = ["S603", "S607"]
"scripts/checks/*.py" = ["S603", "S607"]

# The tests for the checks. Relaxed for the same reasons as the end-to-end
# suite below, and no others.
"test/scripts/*.py" = [
    "S101",   # assert is how pytest reports
    "ANN001", # fixtures are typed by pytest at the call site
    "ANN201",
    "INP001", # a test directory is found by pytest, not by the import system
    "PLR2004", # the comparison value is the assertion
    "S603",
    "S607",
]

# The end-to-end suite. Each of these is relaxed because the rule is aimed at
# production code and inverts in a test; none is relaxed because it was noisy.
"test/e2e/*.py" = [
    # assert is how pytest reports. Rewriting these as raise would remove the
    # introspection that makes a failure readable.
    "S101",
    # A fixture requested only for its side effect — a zone that has to exist
    # before the scenario runs — is unused by name and load-bearing in fact.
    "ARG002",
    # Fixtures are typed by pytest at the call site; annotating every fixture
    # parameter restates what the fixture already declares.
    "ANN001",
    "ANN201",
    # Imports inside a test keep an optional dependency out of collection, so a
    # missing library fails the test that needs it rather than the whole run.
    "PLC0415",
    # A test directory is not a package and must not be importable as one:
    # conftest.py is found by pytest, not by the import system.
    "INP001",
    # The comparison values are the assertion. Naming 2 as EXPECTED_VALUES
    # moves the fact being tested away from the line testing it.
    "PLR2004",
    # subprocess, for the one tool with no library interface.
    "S603",
    "S607",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

# --- ty ---------------------------------------------------------------------
# https://docs.astral.sh/ty/
# ty is pre-1.0 (0.0.64 at time of writing). It runs in the gate because its
# findings have been accurate here, but a ty-only failure is reviewed rather
# than trusted blindly — see docs/standards/python-tooling.md.
[tool.ty.src]
include = ["scripts", "test/scripts"]

[tool.ty.rules]
possibly-unresolved-reference = "error"
unresolved-import = "error"
invalid-return-type = "error"
