# Local hooks only: everything runs in the dev container, so a hook that needs
# a host toolchain would break the "no host toolchain" rule in AGENTS.md.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        exclude: '^(vendor/|.*\.md$)'
      - id: end-of-file-fixer
        exclude: '^vendor/'
      - id: check-merge-conflict
      - id: check-yaml
        exclude: '^(vendor/|deployments/compose/)'
      - id: detect-private-key
      - id: mixed-line-ending
        args: [--fix=lf]

  - repo: local
    hooks:
      - id: commitlint
        name: commitlint
        language: system
        stages: [commit-msg]
        # The message arrives on stdin rather than through --edit. commitlint
        # would otherwise resolve the path itself, and in a worktree that is an
        # absolute path into the main checkout's .git — which does not exist
        # inside the container. Reading the file on the host and piping it in
        # works from any checkout.
        entry: python3 -m scripts.checks.commitlint

      # golangci-lint fmt, not gofumpt directly: .golangci.yml already
      # enables gofmt, gofumpt and goimports with the local-prefixes setting,
      # and running the formatter twice from two configurations is how they
      # come to disagree. gofumpt is also not a separate binary in the dev
      # image, so the direct call could never have worked.
      - id: format
        name: golangci-lint fmt
        language: system
        types: [go]
        exclude: '^vendor/'
        pass_filenames: false
        entry: task fmt

      - id: check-pins
        name: verify image digests and action pins
        language: system
        files: '^(\.github/workflows/|deployments/)'
        entry: python3 -m scripts.checks.pins

      # Touching a workflow or the dev image is exactly when the two
      # toolchains diverge, so the check runs at that moment rather than
      # waiting for `task all`.
      - id: check-tool-versions
        name: CI and the dev image agree on tool versions
        language: system
        pass_filenames: false
        files: '^(\.github/workflows/|deployments/containers/)'
        entry: python3 -m scripts.checks.tool_versions

      - id: no-ai-attribution
        name: no AI attribution
        language: system
        stages: [commit-msg]
        entry: python3 -m scripts.checks.no_ai_attribution
