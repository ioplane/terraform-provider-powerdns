# Taskfile — https://taskfile.dev
#
# The only command entry point; there is no Makefile (ADR 0007).
#
#   task            list the tasks
#   task up         start the dev container
#   task all        the pre-merge gate
#   task verify     the full gate, including the lab
#
# Almost everything runs inside the dev container. The lab tasks are the
# exception: they drive Podman on the host, which is the point of running them
# outside it.

version: '3'

vars:
  # One dev container per checkout. main and each worktree get their own, named
  # after the directory, because a shared container is bind-mounted on whichever
  # tree happened to start it — and `task test` would then build the wrong code.
  DEV_SUFFIX:
    sh: 'case "$PWD" in */.worktrees/*) echo "-$(basename "$PWD")" ;; *) echo "" ;; esac'
  COMPOSE_DEV: deployments/compose/compose.dev.yml
  COMPOSE_LAB: deployments/compose/compose.lab.yml
  DC: DEV_SUFFIX={{.DEV_SUFFIX}} podman-compose -f deployments/compose/compose.dev.yml
  EXEC: DEV_SUFFIX={{.DEV_SUFFIX}} podman-compose -f deployments/compose/compose.dev.yml exec -T dev
  TYPE: powerdns
  BINARY: terraform-provider-powerdns
  VERSION:
    sh: git describe --tags --always --dirty 2>/dev/null || cat VERSION 2>/dev/null || echo dev
  GIT_COMMIT:
    sh: git rev-parse --short HEAD 2>/dev/null || echo unknown
  BUILD_DATE:
    sh: date -u +%Y-%m-%dT%H:%M:%SZ
  LDFLAGS: >-
    -s -w
    -X main.version={{.VERSION}}
    -X main.commit={{.GIT_COMMIT}}
    -X main.date={{.BUILD_DATE}}

env:
  # Two authoritative endpoints, not one: views and networks are unimplemented
  # by gpgsql, so a single backend cannot cover the provider (ADR 0005).
  PDNS_SERVER_URL: http://127.0.0.1:18081
  PDNS_SERVER_URL_LMDB: http://127.0.0.1:18091
  PDNS_RECURSOR_SERVER_URL: http://127.0.0.1:18082
  PDNS_DNSDIST_SERVER_URL: http://127.0.0.1:18083
  PDNS_API_KEY: labapikey

tasks:
  default:
    desc: List the available tasks
    silent: true
    cmds: [task --list]

  # Guards. Without these the failure is a podman-compose stack trace rather
  # than a sentence naming the fix.
  _dev-running:
    internal: true
    preconditions:
      - sh: podman container exists terraform-provider-powerdns-dev{{.DEV_SUFFIX}}
        msg: "dev container is not running for this checkout — run: task up"

  _lab-running:
    internal: true
    preconditions:
      - sh: podman container exists pdns-lab-auth-pg
        msg: "lab is not running — run: task lab:up"

  # === Git hooks ===

  hooks:
    desc: Install the pre-commit and commit-msg hooks
    # `pre-commit install` is not idempotent-by-config: a fresh clone has an
    # empty .git/hooks and no amount of committed configuration changes that.
    # Hanging it off `up` means the first command anybody runs installs it,
    # rather than leaving the AI-attribution ban to a step somebody remembers.
    status:
      - test -f "$(git rev-parse --git-common-dir)/hooks/commit-msg"
      - test -f "$(git rev-parse --git-common-dir)/hooks/pre-commit"
    cmds:
      - pre-commit install --hook-type pre-commit --hook-type commit-msg

  hooks:verify:
    desc: Assert the commit-msg hook actually rejects AI attribution
    cmds:
      - scripts/check-hooks.sh

  # === Dev container ===

  up:
    desc: Build and start the dev container
    deps: [hooks]
    cmds: ['{{.DC}} up -d --build']

  down:
    desc: Stop the dev container
    cmds: ['{{.DC}} down']

  restart:
    desc: Restart the dev container
    cmds: [{task: down}, {task: up}]

  shell:
    desc: Open a shell in the dev container
    interactive: true
    cmds: ['{{.DC}} exec dev bash']

  logs:
    desc: Follow the dev container log
    cmds: ['{{.DC}} logs -f dev']

  # === Lab (host-side) ===

  lab:up:
    desc: Start the five-service lab and wait for every API
    cmds: [python3 scripts/automation/lab.py up]

  lab:down:
    desc: Remove the lab, including volumes
    cmds: [python3 scripts/automation/lab.py down]

  lab:status:
    desc: Report lab container state and reported versions
    cmds: [python3 scripts/automation/lab.py status]

  lab:verify:
    desc: Assert the lab matches the pinned PowerDNS versions
    cmds: [python3 scripts/automation/lab.py verify]

  # === Build ===

  build:
    desc: Compile the provider
    deps: [_dev-running]
    sources: ['**/*.go', go.mod, go.sum]
    generates: ['bin/{{.BINARY}}']
    cmds: ['{{.EXEC}} go build -ldflags="{{.LDFLAGS}}" -o bin/{{.BINARY}} .']

  install:
    desc: Install for manual dev_overrides testing
    deps: [_dev-running]
    cmds: ['{{.EXEC}} go install -ldflags="{{.LDFLAGS}}" .']

  # === Test ===

  test:
    desc: Unit tests, race detector on
    deps: [_dev-running]
    cmds: ['{{.EXEC}} go test ./... -race -count=1']

  test:contract:
    desc: Contract tests against recorded fixtures — no containers needed
    deps: [_dev-running]
    # No build tag: these are ordinary tests and belong in the default run too.
    # The target names the fast feedback loop — replay the recorded responses
    # and cross-check them against the specification, without starting the lab.
    cmds: ['{{.EXEC}} go test ./internal/testutil/... -race -count=1 -v']

  test:run:
    desc: Run one test — task test:run RUN=TestX PKG=./internal/x
    deps: [_dev-running]
    requires:
      vars: [RUN]
    cmds: ['{{.EXEC}} go test -run "{{.RUN}}" {{.PKG | default "./..."}} -race -count=1 -v']

  fixtures:record:
    desc: Re-record the HTTP fixtures against the running lab
    deps: [_dev-running, _lab-running]
    cmds:
      # Deliberately manual, and deliberately not part of any gate. A fixture
      # that re-records itself is not a fixture: the value is that a change in
      # what PowerDNS sends arrives as a diff somebody reads.
      - >-
        {{.EXEC}} env RECORD_FIXTURES=1 go test -tags acceptance
        ./internal/testutil -run TestRecordFixtures -count=1 -v
      - cmd: echo 'fixtures recorded — review `git diff internal/testutil/testdata/fixtures`'
        silent: true

  testacc:
    desc: Acceptance tests against the lab
    deps: [_dev-running, _lab-running]
    cmds:
      - '{{.EXEC}} env TF_ACC=1 go test -tags acceptance ./internal/... -race -count=1 -timeout 120m -v'

  # === Go quality ===

  lint:
    desc: golangci-lint v2
    deps: [_dev-running]
    cmds: ['{{.EXEC}} golangci-lint run ./...']

  lint:fix:
    desc: golangci-lint with --fix
    deps: [_dev-running]
    cmds: ['{{.EXEC}} golangci-lint run --fix ./...']

  fmt:
    desc: Apply the Go formatters
    deps: [_dev-running]
    cmds: ['{{.EXEC}} golangci-lint fmt ./...']

  lint:pins:
    desc: Every image digest and action SHA resolves, and none float
    cmds: [scripts/check-pins.sh]

  lint:tools:
    desc: CI installs the same tool versions the dev image is built with
    cmds: [scripts/check-tool-versions.sh]

  lint:actions:
    desc: actionlint, shellcheck and zizmor over the workflows
    # A workflow is only executed by pushing it. Without this the first reader
    # of a typo in a `run:` block is the runner, after the merge.
    #
    # actionlint hands every `run:` block to shellcheck, so the shell inside a
    # workflow is held to the same standard as a script. zizmor asks the other
    # question — not "does this parse" but "what could this leak": a checkout
    # credential left in .git/config, a cache restored into a signing job.
    deps: [_dev-running]
    cmds:
      - '{{.EXEC}} actionlint'
      - '{{.EXEC}} zizmor --format plain .github/workflows/'

  lint:shell:
    desc: shellcheck and shfmt over the scripts
    deps: [_dev-running]
    cmds:
      - '{{.EXEC}} shellcheck scripts/*.sh'
      - '{{.EXEC}} shfmt -d -i 2 -ci scripts/'

  lint:containers:
    desc: hadolint over the Containerfiles
    deps: [_dev-running]
    cmds: ['{{.EXEC}} hadolint deployments/containers/Containerfile.dev']

  semgrep:
    desc: Semantic security scan
    # In the container, like everything else. It ran on the host until the
    # workflows needed a version to agree with, and a tool with no pinned
    # version cannot be the same tool twice.
    deps: [_dev-running]
    cmds:
      - >-
        {{.EXEC}} semgrep --config=p/golang --config=p/security-audit
        --config=p/secrets --metrics=off --error .

  vulncheck:
    desc: govulncheck
    deps: [_dev-running]
    cmds: ['{{.EXEC}} govulncheck ./...']

  osv-scan:
    desc: osv-scanner
    deps: [_dev-running]
    cmds: ['{{.EXEC}} osv-scanner scan --recursive .']

  # === Python quality ===

  py:lint:
    desc: ruff check and format check
    deps: [_dev-running]
    cmds:
      - '{{.EXEC}} uv run ruff check scripts/'
      - '{{.EXEC}} uv run ruff format --check scripts/'

  py:fmt:
    desc: ruff format and autofix
    deps: [_dev-running]
    cmds:
      - '{{.EXEC}} uv run ruff format scripts/'
      - '{{.EXEC}} uv run ruff check --fix scripts/'

  py:typecheck:
    desc: ty type check (pre-1.0 — a ty-only failure is reviewed, not obeyed)
    deps: [_dev-running]
    cmds: ['{{.EXEC}} uv run ty check scripts/']

  py:
    desc: The Python gate
    cmds: [{task: 'py:lint'}, {task: 'py:typecheck'}]

  # === Terraform ===

  tf:fmt:
    desc: terraform fmt on examples
    deps: [_dev-running]
    # `examples/` arrives in phase 7. Until then there is nothing to format,
    # which is not a gate failure.
    status: ['test ! -d examples']
    cmds: ['{{.EXEC}} terraform fmt -recursive examples']

  tf:fmt:check:
    desc: terraform fmt -check on examples
    deps: [_dev-running]
    status: ['test ! -d examples']
    cmds: ['{{.EXEC}} terraform fmt -check -recursive examples']

  # === Docs ===

  docs:
    desc: Generate registry documentation from the schema
    deps: [_dev-running]
    cmds: ['{{.EXEC}} tfplugindocs generate --provider-name {{.TYPE}}']

  docs:check:
    desc: Validate the registry documentation
    deps: [_dev-running]
    cmds: ['{{.EXEC}} tfplugindocs validate --provider-name {{.TYPE}}']

  docs:lint:
    desc: markdownlint, yamllint, cspell
    deps: [_dev-running]
    cmds:
      - '{{.EXEC}} markdownlint-cli2 "**/*.md" "#node_modules" "#bin" "#dist"'
      - '{{.EXEC}} uv run yamllint -c .yamllint.yaml .'
      - '{{.EXEC}} cspell --no-progress --no-summary --config .cspell.json "**/*.md" "**/*.go"'
      - scripts/check-badges.sh

  # === Release ===

  release:check:
    desc: Everything about a release that can be checked before building
    deps: [_dev-running]
    # Cheap checks first, and all of them before goreleaser is asked to build
    # anything: the Registry treats a published version as immutable, so a
    # wrong release is corrected by publishing another and leaving the wrong
    # one visible forever.
    cmds:
      - scripts/check-release.sh {{.VERSION_ARG}}
      - '{{.EXEC}} goreleaser check'
      - task: 'docs:drift'

  docs:drift:
    desc: The generated registry documentation matches the schema and examples
    deps: [_dev-running]
    # Regenerate and diff. Stale pages are shipped to the Registry as if they
    # described this version, and cannot be corrected in place afterwards.
    cmds:
      - '{{.EXEC}} tfplugindocs generate --provider-name {{.TYPE}}'
      - cmd: |
          if ! git diff --quiet -- docs/; then
            echo 'the generated documentation is out of date — run `task docs` and commit the result' >&2
            git --no-pager diff --stat -- docs/ >&2
            exit 1
          fi
          echo 'ok    generated documentation is in sync'
        silent: true

  # === Dependencies ===

  tidy:
    desc: go mod tidy
    deps: [_dev-running]
    cmds: ['{{.EXEC}} go mod tidy']

  # === Aggregate gates ===

  all:
    desc: Pre-merge gate — everything that does not need the lab
    cmds:
      - {task: 'hooks:verify'}
      - {task: build}
      - {task: test}
      - {task: 'test:contract'}
      - {task: lint}
      - {task: 'lint:pins'}
      - {task: 'lint:tools'}
      - {task: 'lint:actions'}
      - {task: 'lint:shell'}
      - {task: 'lint:containers'}
      - {task: semgrep}
      - {task: py}
      - {task: 'tf:fmt:check'}
      - {task: 'docs:lint'}
      - {task: vulncheck}

  verify:
    desc: Full gate — `all` plus lab acceptance on both backends
    cmds:
      - {task: all}
      - {task: 'lab:verify'}
      - {task: testacc}
      - cmd: echo 'verify — all gates green'

  # === Misc ===

  clean:
    desc: Remove build output
    cmds: [rm -rf bin/ dist/ coverage.out coverage.html]

  versions:
    desc: Report the pinned toolchain versions
    deps: [_dev-running]
    cmds:
      - '{{.EXEC}} go version'
      - '{{.EXEC}} terraform version'
      - '{{.EXEC}} tofu version'
      - '{{.EXEC}} terragrunt --version'
      - '{{.EXEC}} golangci-lint version --short'
      - '{{.EXEC}} uv --version'
      - '{{.EXEC}} uv run ruff --version'
      - '{{.EXEC}} uv run ty --version'
      - '{{.EXEC}} semgrep --version'
