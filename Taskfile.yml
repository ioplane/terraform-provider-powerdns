# Taskfile — https://taskfile.dev
#
# The only command entry point; there is no Makefile (ADR 0007).
#
#   task            list the tasks
#   task up         start the dev container
#   task all        the pre-merge gate
#   task verify     the full gate, including the lab
#
# Almost everything runs inside the dev container. The lab tasks are the
# exception: they drive Podman on the host, which is the point of running them
# outside it.

version: '3'

vars:
  # One dev container per checkout. The main checkout keeps the historical
  # unsuffixed names. A linked worktree gets a readable basename plus a stable
  # hash of its canonical root, so equal basenames and subdirectories cannot
  # address another worktree's objects.
  DEV_SUFFIX:
    sh: scripts/dev-suffix.sh
  COMPOSE_DEV: deployments/compose/compose.dev.yml
  COMPOSE_LAB: deployments/compose/compose.lab.yml
  DEV_PROJECT: terraform-provider-powerdns-dev{{.DEV_SUFFIX}}
  DC: DEV_SUFFIX={{.DEV_SUFFIX}} podman-compose -p {{.DEV_PROJECT}} -f deployments/compose/compose.dev.yml
  EXEC: DEV_SUFFIX={{.DEV_SUFFIX}} podman-compose -p {{.DEV_PROJECT}} -f deployments/compose/compose.dev.yml exec -T dev
  TYPE: powerdns
  BINARY: terraform-provider-powerdns
  VERSION:
    sh: git describe --tags --always --dirty 2>/dev/null || cat VERSION 2>/dev/null || echo dev
  GIT_COMMIT:
    sh: git rev-parse --short HEAD 2>/dev/null || echo unknown
  BUILD_DATE:
    sh: date -u +%Y-%m-%dT%H:%M:%SZ
  LDFLAGS: >-
    -s -w
    -X main.version={{.VERSION}}
    -X main.commit={{.GIT_COMMIT}}
    -X main.date={{.BUILD_DATE}}

env:
  # Two authoritative endpoints, not one: views and networks are unimplemented
  # by gpgsql, so a single backend cannot cover the provider (ADR 0005).
  PDNS_SERVER_URL: http://127.0.0.1:18081
  PDNS_SERVER_URL_LMDB: http://127.0.0.1:18091
  PDNS_RECURSOR_SERVER_URL: http://127.0.0.1:18082
  PDNS_DNSDIST_SERVER_URL: http://127.0.0.1:18083
  PDNS_API_KEY: labapikey

tasks:
  default:
    desc: List the available tasks
    silent: true
    cmds: [task --list]

  # Guards. Without these the failure is a podman-compose stack trace rather
  # than a sentence naming the fix.
  _dev-running:
    internal: true
    preconditions:
      - sh: podman container exists terraform-provider-powerdns-dev{{.DEV_SUFFIX}}
        msg: "dev container is not running for this checkout — run: task up"
      - sh: >-
          test "$({{.EXEC}} go env GOVERSION)" =
          "go$(awk '$1 == "go" { print $2; exit }' go.mod)"
        msg: "dev container Go runtime does not match go.mod — run: task recreate"

  _lab-running:
    internal: true
    preconditions:
      # `container exists` is also true for a stopped container, so it would
      # pass on a lab that is down and leave every test to fail on a refused
      # connection instead. Filtering on status avoids `--format`, whose Go
      # template braces Task would interpolate as its own before podman sees
      # them — which is how the first attempt at this check failed open.
      - sh: podman ps --quiet --filter name=pdns-lab-auth-pg --filter status=running | grep -q .
        msg: "lab is not running — run: task lab:up"

  # === Git hooks ===

  hooks:
    desc: Install the pre-commit and commit-msg hooks
    # `pre-commit install` is not idempotent-by-config: a fresh clone has an
    # empty .git/hooks and no amount of committed configuration changes that.
    # Hanging it off `up` means the first command anybody runs installs it,
    # rather than leaving the AI-attribution ban to a step somebody remembers.
    status:
      - test -f "$(git rev-parse --git-common-dir)/hooks/commit-msg"
      - test -f "$(git rev-parse --git-common-dir)/hooks/pre-commit"
    cmds:
      - pre-commit install --hook-type pre-commit --hook-type commit-msg

  hooks:verify:
    desc: Assert the commit-msg hook actually rejects AI attribution
    cmds:
      - python3 -m scripts.checks.hooks

  # === Dev container ===

  up:
    desc: Build and start the dev container
    deps: [hooks]
    cmds: ['{{.DC}} up -d --build']

  recreate:
    desc: Rebuild and explicitly replace this checkout's dev container
    deps: [hooks]
    cmds:
      - '{{.DC}} build'
      - >-
          target=terraform-provider-powerdns-dev{{.DEV_SUFFIX}};
          expected_project={{.DEV_PROJECT}};
          expected_source="$(pwd -P)";
          if podman container exists "$target"; then
            inspect_json="$(podman inspect "$target")" ||
              { echo "refusing to recreate $target: inspect failed" >&2; exit 1; };
            actual_project="$(printf '%s\n' "$inspect_json" |
              jq -er '.[0].Config.Labels["com.docker.compose.project"] //
                .[0].Config.Labels["io.podman.compose.project"]')" ||
              { echo "refusing to recreate $target: compose project label is missing" >&2; exit 1; };
            actual_source="$(printf '%s\n' "$inspect_json" |
              jq -er '[.[0].Mounts[] |
                select(.Type == "bind" and .Destination == "/app") | .Source] |
                if length == 1 then .[0] else empty end')" ||
              { echo "refusing to recreate $target: one /app bind is required" >&2; exit 1; };
            actual_source="$(CDPATH= cd "$actual_source" 2>/dev/null && pwd -P)" ||
              { echo "refusing to recreate $target: /app source cannot be resolved" >&2; exit 1; };
            if [ "$actual_project" != "$expected_project" ] ||
               [ "$actual_source" != "$expected_source" ]; then
              echo "refusing to recreate $target: ownership mismatch" >&2;
              printf '%s\n' "expected project: $expected_project" "found project: $actual_project"
                "expected /app source: $expected_source" "found /app source: $actual_source" >&2;
              exit 1;
            fi;
            podman rm --force "$target";
          fi
      - '{{.DC}} up -d --no-build'

  down:
    desc: Stop the dev container
    cmds: ['{{.DC}} down']

  restart:
    desc: Restart the dev container
    cmds: [{task: down}, {task: up}]

  shell:
    desc: Open a shell in the dev container
    interactive: true
    cmds: ['{{.DC}} exec dev bash']

  logs:
    desc: Follow the dev container log
    cmds: ['{{.DC}} logs -f dev']

  # === Worktrees ===

  worktree:new:
    desc: Create a worktree cut from origin/main — task worktree:new BRANCH=sprint/S1-x
    requires:
      vars: [BRANCH]
    cmds: ['python3 -m scripts.automation.worktree new {{.BRANCH}}']

  worktree:rm:
    desc: Remove a worktree and delete its branch — task worktree:rm BRANCH=sprint/S1-x
    requires:
      vars: [BRANCH]
    cmds: ['python3 -m scripts.automation.worktree rm {{.BRANCH}}']

  worktree:ls:
    desc: List worktrees
    cmds: ['python3 -m scripts.automation.worktree ls']

  # === Lab (host-side) ===

  # AUTH selects the authoritative branch — 5.1 (default) or 5.0. The other
  # three services do not move: a difference between two acceptance runs has to
  # be attributable to the branch and to nothing else.
  lab:up:
    desc: Start the five-service lab and wait for every API — task lab:up AUTH=5.0
    cmds: ['python3 -m scripts.automation.lab up --auth {{.AUTH | default "5.1"}}']

  lab:down:
    desc: Remove the lab, including volumes
    cmds: ['python3 -m scripts.automation.lab down --auth {{.AUTH | default "5.1"}}']

  lab:status:
    desc: Report lab container state and reported versions
    cmds: ['python3 -m scripts.automation.lab status --auth {{.AUTH | default "5.1"}}']

  lab:verify:
    desc: Assert the lab matches the pinned PowerDNS versions
    cmds: ['python3 -m scripts.automation.lab verify --auth {{.AUTH | default "5.1"}}']

  # === Build ===

  build:
    desc: Compile the provider
    deps: [_dev-running]
    sources: ['**/*.go', go.mod, go.sum]
    generates: ['bin/{{.BINARY}}']
    cmds: ['{{.EXEC}} go build -ldflags="{{.LDFLAGS}}" -o bin/{{.BINARY}} .']

  install:
    desc: Install for manual dev_overrides testing
    deps: [_dev-running]
    cmds: ['{{.EXEC}} go install -ldflags="{{.LDFLAGS}}" .']

  # === Test ===

  test:
    desc: Unit tests, race detector, shuffled order, atomic coverage
    deps: [_dev-running]
    cmds: ['{{.EXEC}} go test ./... -race -shuffle=on -covermode=atomic -count=1']

  test:contract:
    desc: Contract tests against recorded fixtures — no containers needed
    deps: [_dev-running]
    # No build tag: these are ordinary tests and belong in the default run too.
    # The target names the fast feedback loop — replay the recorded responses
    # and cross-check them against the specification, without starting the lab.
    cmds: ['{{.EXEC}} go test ./internal/testutil/... -race -count=1 -v']

  test:run:
    desc: Run one test — task test:run RUN=TestX PKG=./internal/x
    deps: [_dev-running]
    requires:
      vars: [RUN]
    cmds: ['{{.EXEC}} go test -run "{{.RUN}}" {{.PKG | default "./..."}} -race -count=1 -v']

  fixtures:record:
    desc: Re-record the HTTP fixtures against the running lab
    deps: [_dev-running, _lab-running]
    cmds:
      # Deliberately manual, and deliberately not part of any gate. A fixture
      # that re-records itself is not a fixture: the value is that a change in
      # what PowerDNS sends arrives as a diff somebody reads.
      - >-
        {{.EXEC}} env RECORD_FIXTURES=1 go test -tags acceptance
        ./internal/testutil -run TestRecordFixtures -count=1 -v
      - cmd: echo 'fixtures recorded — review `git diff internal/testutil/testdata/fixtures`'
        silent: true

  testacc:
    desc: Acceptance tests against the lab
    deps: [_dev-running, _lab-running]
    cmds:
      - '{{.EXEC}} env TF_ACC=1 go test -tags acceptance ./internal/... -race -count=1 -timeout 120m -v'

  # === Go quality ===

  lint:
    desc: golangci-lint v2
    deps: [_dev-running]
    cmds: ['{{.EXEC}} golangci-lint run ./...']

  vet:
    desc: Go vet with the Go 1.27 stdversion analyzer
    deps: [_dev-running]
    cmds: ['{{.EXEC}} go vet ./...']

  lint:fix:
    desc: golangci-lint with --fix
    deps: [_dev-running]
    cmds: ['{{.EXEC}} golangci-lint run --fix ./...']

  fmt:
    desc: Apply the Go formatters
    deps: [_dev-running]
    cmds: ['{{.EXEC}} golangci-lint fmt ./...']

  lint:pins:
    desc: Every image digest and action SHA resolves, and none float
    cmds: [python3 -m scripts.checks.pins]

  lint:protection:
    desc: Required status checks name jobs that exist
    # Host-side: it asks GitHub for the protection rule. Without the
    # administration scope it warns and passes, so the gate does not depend on
    # who is running it.
    cmds: ['python3 -m scripts.checks.protection']

  lint:tools:
    desc: CI installs the same tool versions the dev image is built with
    cmds: [python3 -m scripts.checks.tool_versions]

  lint:actions:
    desc: actionlint, shellcheck and zizmor over the workflows
    # A workflow is only executed by pushing it. Without this the first reader
    # of a typo in a `run:` block is the runner, after the merge.
    #
    # actionlint hands every `run:` block to shellcheck, so the shell inside a
    # workflow is held to the same standard as a script. zizmor asks the other
    # question — not "does this parse" but "what could this leak": a checkout
    # credential left in .git/config, a cache restored into a signing job.
    deps: [_dev-running]
    cmds:
      - '{{.EXEC}} actionlint'
      - '{{.EXEC}} zizmor --format plain .github/workflows/'

  lint:shell:
    desc: shellcheck over repository shell
    deps: [_dev-running]
    # The host-side worktree identity helper is POSIX shell. The remaining
    # shell is the import snippets, which tfplugindocs renders into registry
    # pages and readers copy from there.
    # -s bash, not a shebang: tfplugindocs renders these files verbatim into
    # the registry pages, and a shebang would appear in the published example.
    cmds:
      - '{{.EXEC}} shellcheck scripts/dev-suffix.sh'
      - '{{.EXEC}} shellcheck -s bash examples/resources/*/import.sh'

  lint:containers:
    desc: hadolint over the Containerfiles
    deps: [_dev-running]
    cmds: ['{{.EXEC}} hadolint deployments/containers/Containerfile.dev']

  semgrep:
    desc: Semantic security scan
    # In the container, like everything else. It ran on the host until the
    # workflows needed a version to agree with, and a tool with no pinned
    # version cannot be the same tool twice.
    deps: [_dev-running]
    cmds:
      - >-
        {{.EXEC}} semgrep --config=p/golang --config=p/security-audit
        --config=p/secrets --metrics=off --error .

  vulncheck:
    desc: govulncheck
    deps: [_dev-running]
    cmds: ['{{.EXEC}} govulncheck ./...']

  osv-scan:
    desc: osv-scanner
    deps: [_dev-running]
    cmds: ['{{.EXEC}} osv-scanner scan --recursive .']

  # === Python quality ===

  py:lint:
    desc: ruff check and format check
    deps: [_dev-running]
    cmds:
      - '{{.EXEC}} uv run --locked ruff check scripts/ test/scripts/'
      - '{{.EXEC}} uv run --locked ruff format --check scripts/ test/scripts/'

  py:fmt:
    desc: ruff format and autofix
    deps: [_dev-running]
    cmds:
      - '{{.EXEC}} uv run --locked ruff format scripts/ test/scripts/'
      - '{{.EXEC}} uv run --locked ruff check --fix scripts/ test/scripts/'

  py:typecheck:
    desc: ty type check (pre-1.0 — a ty-only failure is reviewed, not obeyed)
    deps: [_dev-running]
    # --group e2e: scripts/automation/e2e.py imports boto3 and tenacity, which
    # live in that group. Without it ty resolved them only when a previous
    # `task e2e` had left them in the virtualenv, so whether the gate passed
    # depended on what had been run before it.
    cmds: ['{{.EXEC}} uv run --locked --group e2e ty check scripts/ test/scripts/']

  py:test:
    desc: pytest over the checks under scripts/checks/
    deps: [_dev-running]
    # The checks were shell scripts whose only test was running them, so a
    # branch that never executed shipped several times. These are the branches.
    cmds: ['{{.EXEC}} uv run --locked pytest']

  py:
    desc: The Python gate
    cmds: [{task: 'py:lint'}, {task: 'py:typecheck'}, {task: 'py:test'}]

  # === Terraform ===

  tf:fmt:
    desc: terraform fmt on examples
    deps: [_dev-running]
    # `examples/` arrives in phase 7. Until then there is nothing to format,
    # which is not a gate failure.
    status: ['test ! -d examples']
    cmds: ['{{.EXEC}} terraform fmt -recursive examples']

  tf:fmt:check:
    desc: terraform fmt -check on examples
    deps: [_dev-running]
    status: ['test ! -d examples']
    cmds: ['{{.EXEC}} terraform fmt -check -recursive examples']

  # === Docs ===

  docs:
    desc: Generate registry documentation from the schema
    deps: [_dev-running]
    cmds: ['{{.EXEC}} tfplugindocs generate --provider-name {{.TYPE}}']

  docs:check:
    desc: Validate the registry documentation
    deps: [_dev-running]
    cmds: ['{{.EXEC}} tfplugindocs validate --provider-name {{.TYPE}}']

  docs:lint:
    desc: markdownlint, yamllint, cspell
    deps: [_dev-running]
    cmds:
      - '{{.EXEC}} markdownlint-cli2 "**/*.md" "#node_modules" "#bin" "#dist"'
      - '{{.EXEC}} uv run --locked yamllint -c .yamllint.yaml .'
      - '{{.EXEC}} cspell --no-progress --no-summary --config .cspell.json "**/*.md" "**/*.go"'
      - python3 -m scripts.checks.badges

  # === End-to-end ===

  e2e:up:
    desc: Bring up the end-to-end fixture — MinIO, git, the bucket, the module
    # Host-side, like the lab: it drives podman rather than running inside it.
    deps: [_lab-running]
    cmds: ['uv run --group e2e python -m scripts.automation.e2e up']

  e2e:down:
    desc: Remove the end-to-end fixture, including its volumes
    cmds: ['uv run --group e2e python -m scripts.automation.e2e down']

  e2e:status:
    desc: Report what the end-to-end fixture is running
    cmds: ['uv run --group e2e python -m scripts.automation.e2e status']

  e2e:
    desc: The end-to-end suite — terragrunt, S3 state, git module, real DNS
    deps: [_dev-running, _lab-running]
    cmds:
      - '{{.EXEC}} uv run --group e2e pytest test/e2e -v --timeout=900'

  # === Release ===

  release:dryrun:
    desc: Build a snapshot and assert it is shaped the way the Registry ingests
    deps: [_dev-running]
    # v0.1.0 was built, signed, published and refused. Every check asked
    # whether the artefacts were correct; none asked whether they were the ones
    # the Registry accepts. Twenty seconds here answers that.
    cmds:
      - '{{.EXEC}} goreleaser release --snapshot --clean --skip=publish,sign'
      - python3 -m scripts.checks.release_artifacts dist

  release:check:
    desc: Everything about a release that can be checked before building
    deps: [_dev-running]
    # Cheap checks first, and all of them before goreleaser is asked to build
    # anything: the Registry treats a published version as immutable, so a
    # wrong release is corrected by publishing another and leaving the wrong
    # one visible forever.
    cmds:
      - python3 -m scripts.checks.release {{.VERSION_ARG}}
      - '{{.EXEC}} goreleaser check'
      - task: 'docs:drift'
      - task: 'release:dryrun'

  docs:drift:
    desc: The generated registry documentation matches the schema and examples
    deps: [_dev-running]
    # Regenerate and diff. Stale pages are shipped to the Registry as if they
    # described this version, and cannot be corrected in place afterwards.
    cmds:
      - '{{.EXEC}} tfplugindocs generate --provider-name {{.TYPE}}'
      - cmd: |
          # Only the paths tfplugindocs writes. docs/ also holds this project's
          # own plan, contract, standards and ADRs, and diffing the directory
          # reported an edit to any of them as "generated documentation is out
          # of date" — a release blocked for a reason that was not true.
          if ! git diff --quiet -- docs/index.md docs/resources docs/data-sources docs/functions docs/ephemeral-resources docs/actions; then
            echo 'the generated documentation is out of date — run `task docs` and commit the result' >&2
            git --no-pager diff --stat -- docs/index.md docs/resources docs/data-sources docs/functions docs/ephemeral-resources docs/actions >&2
            exit 1
          fi
          echo 'ok    generated documentation is in sync'
        silent: true

  # === Dependencies ===

  tidy:
    desc: go mod tidy
    deps: [_dev-running]
    cmds: ['{{.EXEC}} go mod tidy']

  # === Aggregate gates ===

  all:
    desc: Pre-merge gate — everything that does not need the lab
    cmds:
      - {task: 'hooks:verify'}
      - {task: build}
      - {task: test}
      - {task: 'test:contract'}
      - {task: vet}
      - {task: lint}
      - {task: 'lint:pins'}
      - {task: 'lint:tools'}
      - {task: 'lint:protection'}
      - {task: 'lint:actions'}
      - {task: 'lint:shell'}
      - {task: 'lint:containers'}
      - {task: semgrep}
      - {task: py}
      - {task: 'tf:fmt:check'}
      - {task: 'docs:lint'}
      - {task: vulncheck}

  verify:
    desc: Full gate — `all` plus lab acceptance on both backends
    cmds:
      - {task: all}
      - {task: 'lab:verify'}
      - {task: testacc}
      - cmd: echo 'verify — all gates green'

  # === Misc ===

  clean:
    desc: Remove build output
    cmds: [rm -rf bin/ dist/ coverage.out coverage.html]

  versions:
    desc: Report the pinned toolchain versions
    deps: [_dev-running]
    cmds:
      - '{{.EXEC}} go version'
      - '{{.EXEC}} terraform version'
      - '{{.EXEC}} tofu version'
      - '{{.EXEC}} terragrunt --version'
      - '{{.EXEC}} golangci-lint version --short'
      - '{{.EXEC}} uv --version'
      - '{{.EXEC}} uv run --locked ruff --version'
      - '{{.EXEC}} uv run --locked ty --version'
      - '{{.EXEC}} semgrep --version'
