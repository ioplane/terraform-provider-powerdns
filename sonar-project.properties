# SonarQube Cloud, CI-based analysis.
#
# Not automatic analysis. The documentation is explicit that coverage is
# unsupported for Go under automatic analysis, and that the two modes conflict:
# with automatic analysis enabled a CI analysis fails and disrupts the build.
# So this file arriving in the repository is half the change; the other half is
# turning automatic analysis off in the project's settings, which is a web form
# and cannot be done from here.

sonar.projectKey=ioplane_terraform-provider-powerdns
sonar.organization=ioplane

# The provider's own code. Everything else in this repository is fixture,
# automation or generated documentation, and measuring it would move the
# numbers without saying anything about the provider.
sonar.sources=.
sonar.exclusions=\
  test/**,\
  scripts/**,\
  examples/**,\
  docs/**,\
  deployments/**,\
  .github/**,\
  **/testdata/**

sonar.tests=.
sonar.test.inclusions=**/*_test.go

# Go's native coverage profile, produced by the workflow from the unit tests
# *and* the acceptance suite against the real lab. Unit coverage alone would
# understate this provider badly: most of its logic is HTTP conversation with
# PowerDNS, and the tests that exercise it need a server.
sonar.go.coverage.reportPaths=coverage.out
