# GitLab CI — the quality gate.
#
# The split with GitHub Actions is deliberate and documented in AGENTS.md:
# GitLab owns build, test, lint, security and the acceptance matrix; GitHub
# owns release only, because the Terraform Registry publishes from GitHub tags
# and signed releases. The two do not overlap, so they cannot disagree.
#
# Every image is pinned by digest. A tag is a mutable reference.

variables:
  GO_IMAGE: golang:1.26-trixie@sha256:4ee9ffa999b4583ce281939cdff828763083610292f252279a0cee77473bd9a7
  GOFLAGS: -buildvcs=false
  GOMODCACHE: ${CI_PROJECT_DIR}/.cache/go-mod
  GOCACHE: ${CI_PROJECT_DIR}/.cache/go-build
  FF_USE_FASTZIP: "true"

default:
  image: ${GO_IMAGE}
  cache:
    key:
      files: [go.sum]
    paths: [.cache/go-mod, .cache/go-build]

stages: [build, test, quality, security, acceptance]

# --- build ---

build:
  stage: build
  script:
    - go build -ldflags="-s -w -X main.version=ci-${CI_COMMIT_SHORT_SHA}" -o bin/terraform-provider-powerdns .
  artifacts:
    paths: [bin/]
    expire_in: 1 day

# --- test ---

unit:
  stage: test
  script:
    - go install gotest.tools/gotestsum@latest
    - gotestsum --junitfile report.xml --format short-verbose --
        ./... -race -count=1 -coverprofile=coverage.out -covermode=atomic
    - go tool cover -func=coverage.out | tail -1
  coverage: '/total:\s+\(statements\)\s+(\d+\.\d+)%/'
  artifacts:
    when: always
    reports:
      junit: report.xml
    paths: [coverage.out]

contract:
  stage: test
  # Recorded fixtures, no containers. Fast, and it is what keeps the client
  # honest about real PowerDNS payloads without needing the lab.
  script:
    - go test -tags contract ./internal/api/... -race -count=1

# --- quality ---

lint:go:
  stage: quality
  image: golangci/golangci-lint:v2.12.2@sha256:5cceeef04e53efe1470638d4b4b4f5ceefd574955ab3941b2d9a68a8c9ad5240
  script:
    - golangci-lint run ./... --timeout=10m

lint:python:
  stage: quality
  image: ghcr.io/astral-sh/uv:0.11.33-debian@sha256:29ec6e910c37a35758a8040fc294b717bf61ecdf6e107d1e6fdaa85c5dc0353a
  script:
    - uv run ruff check scripts/
    - uv run ruff format --check scripts/
    # ty is pre-1.0; a ty-only failure is reviewed, not obeyed.
    - uv run ty check scripts/

lint:pins:
  stage: quality
  script:
    - scripts/check-pins.sh

commits:
  stage: quality
  # The commit-msg hook only protects commits made in a clone that ran
  # `task hooks`. This is the half that protects the branch, and it caught
  # nine of the first ten commits here when it was finally run.
  script:
    - npm install --no-save @commitlint/cli @commitlint/config-conventional
    - |
      base="${CI_MERGE_REQUEST_DIFF_BASE_SHA:-$(git rev-parse HEAD~1)}"
      npx commitlint --config .commitlintrc.yaml --from "$base" --to HEAD --verbose
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

docs:
  stage: quality
  script:
    - go install github.com/hashicorp/terraform-plugin-docs/cmd/tfplugindocs@v0.25.0
    - tfplugindocs validate --provider-name powerdns

# --- security ---

vulncheck:
  stage: security
  script:
    - go install golang.org/x/vuln/cmd/govulncheck@v1.6.0
    - govulncheck ./...

semgrep:
  stage: security
  image: semgrep/semgrep:latest@sha256:98c2572fced2474539fd27cab3207ebd8e95e4e7aab4c3b381fdc5e2641d9941
  script:
    - semgrep --config=p/golang --config=p/security-audit --config=p/secrets --metrics=off --error .

# --- acceptance ---
#
# The matrix is the design, not thoroughness: views and networks are
# unimplemented by gpgsql, so one backend cannot cover this provider.

.acceptance:
  stage: acceptance
  services:
    - name: docker.io/library/postgres:17@sha256:a426e44bac0b759c95894d68e1a0ac03ecc20b619f498a91aae373bf06d8508d
      alias: postgres
      variables:
        POSTGRES_USER: pdns
        POSTGRES_PASSWORD: pdns
        POSTGRES_DB: pdns
  variables:
    TF_ACC: "1"
    PDNS_API_KEY: labapikey
  script:
    - scripts/ci/start-lab.sh
    - go test -tags acceptance ./internal/... -race -count=1 -timeout 60m -v
  after_script:
    - scripts/ci/lab-diagnostics.sh || true

acceptance:gpgsql:
  extends: .acceptance
  variables:
    PDNS_BACKEND: gpgsql
    PDNS_SERVER_URL: http://127.0.0.1:18081

acceptance:lmdb:
  extends: .acceptance
  variables:
    PDNS_BACKEND: lmdb
    PDNS_SERVER_URL: http://127.0.0.1:18091
