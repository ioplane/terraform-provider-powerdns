config:
  default: true
  # Line length is handled by hand-wrapping at 80; tables and links legitimately
  # exceed it and reflowing them hurts readability.
  MD013:
    line_length: 100
    tables: false
    code_blocks: false
  # Duplicate headings are expected across ADRs (Context / Decision).
  MD024:
    siblings_only: true
  MD033: false
  MD041: false

globs:
  - "**/*.md"

ignores:
  - "vendor/**"
  - "node_modules/**"
  # uv materialises this in the working tree when a task runs `uv run`. The
  # packages inside it carry their own documentation; it is not ours to lint.
  - ".venv/**"
  - "bin/**"
  - "dist/**"
  - ".worktrees/**"
  - "CHANGELOG.md"
  # Registry documentation, written by tfplugindocs from the schema and the
  # examples. Its formatting is the generator's; editing it would be undone by
  # the next `task docs`, and holding a machine's output to a hand-writing
  # style guide is a rule nobody can satisfy. `task docs:check` validates it
  # instead, against the Registry's own rules.
  - "docs/index.md"
  - "docs/resources/**"
  - "docs/data-sources/**"
  - "docs/functions/**"
  - "docs/actions/**"
  - "docs/ephemeral-resources/**"
