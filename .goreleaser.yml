version: 2

before:
  hooks:
    - go mod tidy

builds:
  - id: provider
    env: [CGO_ENABLED=0]
    mod_timestamp: '{{ .CommitTimestamp }}'
    flags: [-trimpath]
    ldflags:
      - '-s -w -X main.version={{.Version}} -X main.commit={{.Commit}} -X main.date={{.Date}}'
    goos: [freebsd, windows, linux, darwin]
    goarch: ['386', amd64, arm, arm64]
    ignore:
      - goos: darwin
        goarch: '386'
    binary: '{{ .ProjectName }}_v{{ .Version }}'

archives:
  # The name is mandated verbatim by the Terraform Registry.
  - id: provider
    ids: [provider]
    formats: [zip]
    name_template: '{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}'

checksum:
  # Archives only. The Registry parses SHA256SUMS and expects every line to be
  # part of the version it is ingesting; an SBOM listed there is a file it will
  # not accept, and it rejects the whole submission for it.
  ids: [provider]
  extra_files:
    - glob: 'terraform-registry-manifest.json'
      name_template: '{{ .ProjectName }}_{{ .Version }}_manifest.json'
  name_template: '{{ .ProjectName }}_{{ .Version }}_SHA256SUMS'
  algorithm: sha256

# One SBOM per archive, generated by syft. The Registry ships a binary and
# nothing that describes it; this is the part a consumer can audit.
sboms:
  - artifacts: archive

signs:
  - artifacts: checksum
    args: ["--batch", "-u", "{{ .Env.GPG_FINGERPRINT }}", "--output", "${signature}", "--detach-sign", "${artifact}"]

release:
  extra_files:
    - glob: 'terraform-registry-manifest.json'
      name_template: '{{ .ProjectName }}_{{ .Version }}_manifest.json'

changelog:
  disable: true
