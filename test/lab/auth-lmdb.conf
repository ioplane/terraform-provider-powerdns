# PowerDNS Authoritative 5.1.3 — LMDB variant, used only to test views/networks,
# which the gpgsql backend does not implement in 5.1.
launch=lmdb
lmdb-filename=/data/db.lmdb
api=yes
api-key=labapikey
webserver=yes
webserver-address=0.0.0.0
webserver-port=8081
webserver-allow-from=0.0.0.0/0
local-address=0.0.0.0
local-port=5300
primary=yes
default-ttl=60
views=yes
