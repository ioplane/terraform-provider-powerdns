# PowerDNS Authoritative Server 5.1.3 — lab configuration (gpgsql backend)
# Reference lab for the capability map. Not a production configuration.

# --- Storage: generic PostgreSQL backend ---
launch=gpgsql
gpgsql-host=postgres
gpgsql-port=5432
gpgsql-dbname=pdns
gpgsql-user=pdns
gpgsql-password=pdns
gpgsql-dnssec=yes

# --- HTTP API / web server ---
api=yes
api-key=labapikey
webserver=yes
webserver-address=0.0.0.0
webserver-port=8081
webserver-allow-from=0.0.0.0/0

# --- DNS listener ---
# Port 5300, not 53: the image drops to the unprivileged `pdns` user, which
# cannot bind a privileged port under rootless podman.
local-address=0.0.0.0
local-port=5300

# --- Roles and defaults ---
primary=yes
secondary=yes
default-ttl=60
version-string=anonymous
loglevel=5
