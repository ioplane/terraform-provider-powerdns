-- dnsdist 2.1.0 — lab configuration.
--
-- The webserver is the only part of dnsdist this provider can touch: its API
-- writes exactly two things, PUT /config/allow-from and DELETE /api/v1/cache.
-- Everything below the webserver block is Lua, which is the point being made.

setLocal("0.0.0.0:5302")
addACL("0.0.0.0/0")

webserver("0.0.0.0:8083")
setWebserverConfig({
  apiKey = "labapikey",
  acl = "0.0.0.0/0",
  apiRequiresAuthentication = true,
})

-- setAPIWritable, not apiConfigDir, is what gates the two write operations.
-- isMethodAllowed() in dnsdist-web.cc checks d_apiReadWrite before it looks at
-- the path, so without this every PUT answers 405 regardless of the webserver
-- configuration. Verified against dnsdist-2.1.0.
setAPIWritable(true, "/var/lib/dnsdist")

-- A downstream so the statistics endpoints have something to report.
newServer({ address = "127.0.0.1:5300", name = "lab-auth", checkName = "a.root-servers.net." })

-- A packet cache, so DELETE /api/v1/cache has something to operate on. Without
-- one the endpoint answers 404 — which is about the pool, not about the API.
pc = newPacketCache(10000)
getPool(""):setCache(pc)
