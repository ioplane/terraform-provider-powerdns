extends: default

ignore: |
  vendor/
  bin/
  dist/
  .worktrees/
  .venv/
  # Vendored verbatim from PowerDNS. Its formatting is theirs to fix, and
  # reformatting it here would destroy the thing it is vendored to prove.
  internal/testutil/testdata/spec/

rules:
  line-length:
    max: 120
    level: warning
  document-start: disable
  truthy:
    check-keys: false
  comments:
    min-spaces-from-content: 1
  braces:
    max-spaces-inside: 1
